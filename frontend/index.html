<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FaultZero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="screen-flash" id="screen-flash" aria-hidden="true"></div>
<div class="app">
  <header class="top">
    <a class="brand" href="/" title="Back to the story">
      <svg class="brand-mark" viewBox="0 0 26 26" aria-hidden="true">
        <path d="M13 2 24 8.5v9L13 24 2 17.5v-9Z" fill="none" stroke="#7fe3f0" stroke-width="2"/>
        <path d="M8 13h10" stroke="#f0643a" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">FaultZero</span>
    </a>
    <span class="facility">Data Hall 1, simulated</span>
    <span class="status" id="status">All systems normal</span>

    <div class="readouts">
      <div class="readout"><span class="num" id="clock">--:--</span><span class="lbl">facility time</span></div>
      <div class="readout"><span class="num" id="outdoor">--</span><span class="lbl">outside, Dallas</span></div>
      <div class="readout risk zero" id="risk-wrap"><span class="num" id="risk">0</span><span class="lbl">racks at risk</span></div>
    </div>

    <div class="menu-wrap">
      <button class="btn" id="menu-btn" aria-haspopup="true" aria-expanded="false">Test the facility</button>
      <div class="menu" id="menu" hidden>
        <h3>Break something</h3>
        <div id="menu-break"></div>
        <hr>
        <h3>Fix something</h3>
        <div id="menu-fix"></div>
        <hr>
        <button id="calm-btn">Turn off animations</button>
        <button id="reset-btn">Reset the facility</button>
      </div>
    </div>
  </header>

  <main class="map" id="map" aria-label="Data hall floor map">
    <div id="three" class="three"></div>
    <svg id="svg" role="img" aria-label="Isometric map of the data hall"></svg>
    <div class="view-tools" id="view-tools">
      <span id="view-hint">Drag to turn, scroll to zoom</span>
      <button class="btn" id="view-reset">Reset view</button>
      <div class="switch" id="view-switch" role="group" aria-label="Map view">
        <button id="view-3d" aria-pressed="true">3D</button>
        <button id="view-2d" aria-pressed="false">2D</button>
      </div>
    </div>
    <div class="tip" id="tip" hidden></div>
    <div class="legend" aria-hidden="true">
      <span>Rack inlet 20°C</span><span class="ramp"></span><span>32°C</span>
      <span><i class="key-line" style="color: var(--power)"></i>Power</span>
      <span><i class="key-line" style="color: var(--water)"></i>Chilled water</span>
    </div>
  </main>

  <aside class="side" id="side">
    <div id="slot-incident" aria-live="polite"></div>
    <div id="slot-agent" aria-live="polite"></div>
    <div id="slot-asset"></div>
  </aside>

  <section class="time" aria-label="Predicted cascade">
    <div class="time-head">
      <h2>What fails next</h2>
      <span id="time-sub">Predicted from live readings over the next 60 minutes</span>
    </div>
    <div class="track" id="track"></div>
    <div class="chain" id="chain"></div>
  </section>
</div>
<script type="importmap">
{ "imports": {
    "three": "/static/vendor/three.module.js",
    "three/addons/": "/static/vendor/addons/"
} }
</script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
